<div [class]="[context.theme]">
  <section
    [class]="['toolbar', 'accent-' + context.accentColor]"
    role="toolbar"
    (pointerdown)="onPointerDown($event)"
  >
    @for (action of actions; track action.type) {
    <button type="button" class="toolbar__button" (click)="run(action.type)">
      <app-icon [icon]="action.icon" size="md" [accent]="true" />
      <span class="toolbar__label">{{ action.label }}</span>
    </button>
    }
  </section>
</div>
