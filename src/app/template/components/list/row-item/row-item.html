<div class="row-item" [class.padding]="padding()">
  @if (src()) {
  <div class="icon">
    <img class="row-icon" [src]="src()">
  </div>
  }
  <div class="text">
    <div class="label-container">
      <span class="label">{{ label() }}</span>
      <a (click)="onAction.emit()" class="action">{{ action() }}</a>
    </div>
    <span class="description">{{ description() }}</span>
  </div>
</div>
